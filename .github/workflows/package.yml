name: 手动打包 ZIP
run-name: 打包并发布请求助手 ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号，例如 2.2.0（X.Y.Z，不带 v）"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  package:
    name: 检查、打包并发布 Chrome 插件
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: 获取代码
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: 设置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 校验并设置本次构建版本
        run: node scripts/set-package-version.mjs

      - name: 检查版本尚未发布
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          refs=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v$VERSION" --jq '.[].ref')
          if grep -Fxq "refs/tags/v$VERSION" <<< "$refs"; then
            echo "::error::标签 v$VERSION 已存在，请使用新的版本号；不会覆盖已发布的包。"
            exit 1
          fi

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 逻辑测试
        run: npm test

      - name: 生成正式 Chrome ZIP
        run: npm run build

      - name: 验证 ZIP 内容与版本
        run: python3 scripts/verify-package.py

      - name: 上传 ZIP（保留 30 天）
        id: upload
        uses: actions/upload-artifact@v7
        with:
          path: request-helper-${{ inputs.version }}-chrome.zip
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: 创建 Release 并附加 ZIP
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_url=$(gh release create "v$VERSION" "request-helper-$VERSION-chrome.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "请求助手 $VERSION" \
            --notes "下载下方 request-helper-$VERSION-chrome.zip，解压后在 Chrome 扩展管理页加载包含 manifest.json 的文件夹。" \
            --generate-notes)
          printf 'url=%s\n' "$release_url" >> "$GITHUB_OUTPUT"

      - name: 写入下载说明
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          RELEASE_URL: ${{ steps.release.outputs.url }}
        run: |
          printf '### 请求助手 %s\n\n[Release 与 ZIP 下载](%s) · [Actions 备份附件（30 天）](%s)\n\n解压后在 Chrome 扩展管理页加载包含 manifest.json 的文件夹。\n' "$VERSION" "$RELEASE_URL" "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
